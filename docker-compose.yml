services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/app.sqlite
      RASTERS_DIR: /rasters
      TILES_DIR: /tiles
      RASTER_DOWNLOAD_TIMEOUT: ${RASTER_DOWNLOAD_TIMEOUT:-60}
      RASTER_TILE_ZOOMS: ${RASTER_TILE_ZOOMS:-16-20}
      OSM_CACHE_TTL_SECONDS: ${OSM_CACHE_TTL_SECONDS:-86400}
      OSM_PREFETCH_RADIUS_M: ${OSM_PREFETCH_RADIUS_M:-250}
      OSM_PREFETCH_ZOOMS: ${OSM_PREFETCH_ZOOMS:-16-19}
      OSM_DOWNLOAD_TIMEOUT: ${OSM_DOWNLOAD_TIMEOUT:-20}
      OSM_TILE_USER_AGENT: ${OSM_TILE_USER_AGENT:-gps-location-storage/1.0}
    volumes:
      - ./data:/data
      - ./tiles:/tiles
      - ./shapes:/shapes:ro
      - ./rasters:/rasters:ro
    expose:
      - "8000"

  caddy:
    build: ./caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
